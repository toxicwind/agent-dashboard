# RANGE (agent-dashboard) — the coherent multi-tab dashboard project.
# Its control-plane SPA (:25156) + Svelte passsthrough are served here; this
# manifest exists so the pitchfork-compose accepts the range project.
[daemons.range-ui]
run = "exec /home/toxic/.local/bin/bun run --cwd /home/toxic/estate/ranch/range/apps/delendai-control-plane dev:server"
dir = "/home/toxic/estate/ranch/range"
mise = false
retry = true
boot_start = true
auto = ["start"]
ready_http = "http://127.0.0.1:25156/"
